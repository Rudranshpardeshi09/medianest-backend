# Postgres only. Django runs on the host against it, which keeps the edit
# loop fast and avoids rebuilding an image on every change.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medianest
      POSTGRES_USER: medianest
      POSTGRES_PASSWORD: medianest
    ports:
      - "5432:5432"
    volumes:
      - medianest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medianest"]
      interval: 5s
      retries: 10

volumes:
  medianest_pgdata:
